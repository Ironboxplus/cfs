name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      long:
        description: "Also run the long job (CFS_LONG=1, 30000-op model, durable ack)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

defaults:
  run:
    shell: bash

jobs:
  # The job list lives in ci/groups.txt; this turns it into a matrix.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        run: echo "matrix=$(bash ci/matrix.sh)" >> "$GITHUB_OUTPUT"

  # Build, vet, format, and make sure every test belongs to a job.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get runner parameters
        id: rp
        run: |
          echo "year-week=$(date -u "+%Y%V")" >> "$GITHUB_OUTPUT"
          echo "os-version=$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caching is done below, as rclone's CI does (.github/workflows/build.yml):
          # setup-go's own cache keys only on go.sum, so every matrix job collides on
          # one key and only the first to finish saves its build cache.
          cache: false
      - name: Go paths
        id: go-paths
        run: |
          echo "build-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Downloaded module source is the same for every job: one shared key.
      - name: Module cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.mod-cache }}
          key: go-mod-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ steps.rp.outputs.year-week }}-
            go-mod-
      # Compiled packages depend on the OS and Go version and on what the job builds: one key per job.
      - name: Build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.build-cache }}
          key: go-build-check-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-check-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-
            go-build-check-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-
      # The patched rclone tree only changes with the patches.
      - name: rclone fork cache
        id: rclone-cache
        uses: actions/cache@v6
        with:
          path: ../rclone-fork
          key: rclone-fork-v1.75.2-${{ hashFiles('ci/rclone-patches/*.patch', 'ci/setup-rclone.sh') }}
      - name: rclone fork (v1.75.2 + ci/rclone-patches)
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-rclone.sh
      - run: go build ./...
      - run: GOOS=windows go build ./...
      - run: GOOS=darwin go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not formatted:"; echo "$out"; exit 1; fi
      - name: every test is in a job
        run: bash ci/check-groups.sh
      - name: Trim module cache before it is saved
        if: always()
        run: |
          # The module .zip archives aren't needed to build from the extracted tree
          # (rclone's CI does the same); dropping them roughly halves the cache.
          modcache=$(go env GOMODCACHE | tr '\\' '/')
          find "$modcache/cache/download" -name '*.zip' -type f -delete 2>/dev/null || true

  test:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Get runner parameters
        id: rp
        run: |
          echo "year-week=$(date -u "+%Y%V")" >> "$GITHUB_OUTPUT"
          echo "os-version=$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caching is done below, as rclone's CI does (.github/workflows/build.yml):
          # setup-go's own cache keys only on go.sum, so every matrix job collides on
          # one key and only the first to finish saves its build cache.
          cache: false
      - name: Go paths
        id: go-paths
        run: |
          echo "build-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Downloaded module source is the same for every job: one shared key.
      - name: Module cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.mod-cache }}
          key: go-mod-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ steps.rp.outputs.year-week }}-
            go-mod-
      # Compiled packages depend on the OS and Go version and on what the job builds: one key per job.
      - name: Build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.build-cache }}
          key: go-build-${{ matrix.name }}-${{ matrix.os }}-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ matrix.name }}-${{ matrix.os }}-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-
            go-build-${{ matrix.name }}-${{ matrix.os }}-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-
      # The patched rclone tree only changes with the patches.
      - name: rclone fork cache
        id: rclone-cache
        uses: actions/cache@v6
        with:
          path: ../rclone-fork
          key: rclone-fork-v1.75.2-${{ hashFiles('ci/rclone-patches/*.patch', 'ci/setup-rclone.sh') }}
      - name: rclone fork (v1.75.2 + ci/rclone-patches)
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-rclone.sh
      - name: go test
        env:
          PKGS: ${{ matrix.pkgs }}
          RUN: ${{ matrix.run }}
          VERBOSE: ${{ startsWith(matrix.name, 'core-read') && '-v' || '' }}  # the read tests log their measurements
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m $VERBOSE -run "$RUN" $PKGS 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: tail of the log
        if: failure()
        run: tail -c 200000 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test-tail.log" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: log-${{ matrix.name }}-${{ matrix.os }}
          path: ${{ runner.temp }}/test-tail.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Trim module cache before it is saved
        if: always()
        run: |
          # The module .zip archives aren't needed to build from the extracted tree
          # (rclone's CI does the same); dropping them roughly halves the cache.
          modcache=$(go env GOMODCACHE | tr '\\' '/')
          find "$modcache/cache/download" -name '*.zip' -type f -delete 2>/dev/null || true

  # Manual only: bigger models, big files, the whole-tree dataset over WebDAV, durable ack.
  long:
    if: github.event_name == 'workflow_dispatch' && inputs.long
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get runner parameters
        id: rp
        run: |
          echo "year-week=$(date -u "+%Y%V")" >> "$GITHUB_OUTPUT"
          echo "os-version=$ImageOS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caching is done below, as rclone's CI does (.github/workflows/build.yml):
          # setup-go's own cache keys only on go.sum, so every matrix job collides on
          # one key and only the first to finish saves its build cache.
          cache: false
      - name: Go paths
        id: go-paths
        run: |
          echo "build-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Downloaded module source is the same for every job: one shared key.
      - name: Module cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.mod-cache }}
          key: go-mod-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ steps.rp.outputs.year-week }}-
            go-mod-
      # Compiled packages depend on the OS and Go version and on what the job builds: one key per job.
      - name: Build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.build-cache }}
          key: go-build-long-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-long-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.rp.outputs.year-week }}-
            go-build-long-${{ steps.rp.outputs.os-version }}-go${{ steps.setup-go.outputs.go-version }}-
      # The patched rclone tree only changes with the patches.
      - name: rclone fork cache
        id: rclone-cache
        uses: actions/cache@v6
        with:
          path: ../rclone-fork
          key: rclone-fork-v1.75.2-${{ hashFiles('ci/rclone-patches/*.patch', 'ci/setup-rclone.sh') }}
      - name: rclone fork (v1.75.2 + ci/rclone-patches)
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: bash ci/setup-rclone.sh
      - name: staged ack
        env:
          CFS_LONG: "1"
          CFS_MODEL_OPS: "30000"
        run: |
          set -o pipefail
          go test -count=1 -timeout 60m -p 1 ./core ./frontend/rclone ./test 2>&1 | tee "$RUNNER_TEMP/long.log"
      - name: durable ack
        env:
          CFS_LONG: "1"
          CFS_MODEL_OPS: "30000"
          CFS_TEST_ACK: durable
        run: |
          set -o pipefail
          go test -count=1 -timeout 60m ./core 2>&1 | tee "$RUNNER_TEMP/long-durable.log"
      - name: tail of the logs
        if: failure()
        run: |
          for f in long long-durable; do
            [ -f "$RUNNER_TEMP/$f.log" ] && tail -c 100000 "$RUNNER_TEMP/$f.log" > "$RUNNER_TEMP/$f-tail.log"
          done
          true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: long-logs
          path: ${{ runner.temp }}/*-tail.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Trim module cache before it is saved
        if: always()
        run: |
          # The module .zip archives aren't needed to build from the extracted tree
          # (rclone's CI does the same); dropping them roughly halves the cache.
          modcache=$(go env GOMODCACHE | tr '\\' '/')
          find "$modcache/cache/download" -name '*.zip' -type f -delete 2>/dev/null || true
